<style>

input,select,textarea{font-size:16px;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:100%}

.steps{counter-reset:s;list-style:none;padding:0;display:grid;gap:10px}

.steps li:before{content:counter(s);position:absolute;left:14px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--on);font:700 15px/28px system-ui;text-align:center}
dl{margin:0}dt{font:700 14px system-ui;color:var(--mute);margin-top:12px}dd{margin:2px 0 0}
footer{border-top:1px solid var(--line);padding:20px 0 36px;font-size:15px;color:var(--mute)}

.logo img{height:46px;width:auto;display:block}.flogo{height:40px;width:auto;display:block;margin-bottom:10px}
[hidden]{display:none!important}
.btn{background:var(--y);color:var(--yd);box-shadow:0 1px 2px rgba(15,36,71,.18)}.btn:hover{filter:brightness(.95)}.btn:disabled{opacity:.6;cursor:wait}
.btn.t{background:var(--brand);color:#fff}.btn.o{background:#fff;color:var(--brand);border:2px solid var(--brand);box-shadow:none}
nav a:hover{background:var(--soft)}nav a[aria-current=page]{box-shadow:inset 0 -3px 0 var(--y)}
.card{box-shadow:0 1px 3px rgba(15,36,71,.07)}.card:hover{border-color:#b9c9e4}
.chip{background:#fff;border:2px solid var(--line)}.chip:hover{border-color:var(--brand)}.chip[aria-pressed=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
footer{background:#fff}
fieldset{border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px 16px;display:grid;gap:14px;margin:0;min-width:0}
legend{font:700 16px system-ui;color:var(--brand);padding:0 6px}.lb{font:600 15px system-ui;margin:0 0 5px}
.req{color:#b42318;font-weight:700}.err{color:#b42318}
.dm{font:600 14px system-ui;margin:8px 0 0;color:var(--mute)}.dm-s{color:#0b6b3a}
.dbox{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:12px 0;font:16px/1.4 system-ui;background:#fff}
.dbox.dm-s{border-color:#8fd3ac;background:#f0faf4}.dbox.dm-u{background:var(--soft)}
.pimg{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;margin-bottom:8px;background:var(--soft)}
.oferta{display:inline-block;background:var(--y);color:var(--yd);font:700 14px system-ui;border-radius:8px;padding:3px 9px;margin:2px 0 6px}
.promo h3{margin:2px 0 4px}.promo .row{margin-top:8px}.promo .btn,.promo .chip{min-height:44px;padding:8px 14px;font-size:15px}
.pimg{aspect-ratio:3/2;object-position:center 20%}.pimg.ph{display:grid;place-items:center;font-size:44px}.pimg.big{max-width:560px}
.star{background:none;border:0;font-size:34px;line-height:1;color:#b7791f;cursor:pointer;min-width:44px;min-height:44px}
.sec{border-top:1px solid var(--line);padding:6px 0 10px;margin-top:14px}.sec h2{font-size:19px;margin:12px 0 8px}
.ht{border-collapse:collapse;width:100%;max-width:420px;font:16px system-ui}.ht td{padding:7px 4px;border-bottom:1px solid var(--line)}.ht td:last-child{text-align:right}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;border-radius:14px;padding-bottom:4px}
.slide{flex:0 0 100%;scroll-snap-align:start;background:#fff;border:1px solid var(--line);border-left:6px solid var(--y);border-radius:14px;overflow:hidden}
.slide.t-comunitario{border-left-color:var(--teal)}.slide img{width:100%;aspect-ratio:16/7;object-fit:cover;display:block}
.sl{padding:14px 16px}.sl h3{font-size:20px;margin:6px 0}.sl p{margin:0 0 8px}.carw{margin:18px 0}
@media(min-width:700px){.slide{flex-basis:calc(50% - 6px)}}
</style>
</head>

 {id:"b2",tipo:"comunitario",estado:"borrador",t:"Un sabor que merece llegar a más vecinos",d:"Paletas de manzana con caramelo de un vendedor local. Fotografía y autorización pendientes.",aviso:"Historia comunitaria. No es publicidad pagada."},

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function safeUrl(u){return /^https?:\/\//i.test(u||"")?esc(u):""}
function digits(s){return String(s||"").replace(/\D/g,"")}

function intl(n){var d=digits(n);if(d.length===10)d=CONFIG.pais+d;return d}
function waLink(n,t){return "https://wa.me/"+intl(n)+(t?"?text="+encodeURIComponent(t):"")}

function parseMXN(s){var t=String(s||"").replace(/\s|\$|MXN/gi,"");if(!/^\d{1,5}([.,]\d{1,2})?$/.test(t))return null;return parseFloat(t.replace(",","."))}
function fmtMXN(m){return "$"+Number(m).toLocaleString("es-MX",{minimumFractionDigits:m%1?2:0,maximumFractionDigits:2})+" MXN"}
function dom(x){var d=x.dom;if(!d||!d.o)return{k:"u",t:"Servicio a domicilio por confirmar"};
if(d.o==="no")return{k:"n",t:"No ofrece servicio a domicilio"};
var M={gratis:"Envío gratis",distancia:"Costo según distancia",pedido:"Costo según el pedido"},t;

function add(k,v){if(v)L.push("*"+k+":* "+v)}
add("Productos o servicios",p.productos);add("Colonia o zona",p.zona);add("Dirección (autoriza publicarla)",p.direccion);add("WhatsApp o teléfono del negocio",p.tel);add("Horarios",p.horarios);add("Redes sociales",p.redes);
